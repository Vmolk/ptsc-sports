services:
  - type: web
    name: qaqc-sport-tournament
    env: node
    region: singapore
    plan: free
    buildCommand: npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
