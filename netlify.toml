# ============================================================
# Netlify deployment configuration
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/
# ============================================================

[build]
  # Command Netlify runs to produce the production frontend bundle
  command = "npm run build"
  # Directory that contains the built static assets to publish
  publish = "dist"
  # Directory that contains the serverless backend functions
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# ---- API: route /api/* to the serverless functions ----
# e.g. /api/stats  ->  /.netlify/functions/stats
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# ---- SPA fallback: every other route serves index.html ----
# Lets React Router handle client-side routing (/leaderboard, /sports, ...)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---- Security & caching headers ----
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Long-cache fingerprinted assets produced by Vite
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
